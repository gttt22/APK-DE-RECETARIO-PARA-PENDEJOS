<!DOCTYPE html>
<html lang="es" data-v="inicio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cocina Fácil: recetario para principiantes con fotos, paso a paso, temporizador y calculadora de porciones. Funciona sin internet.">
<meta name="theme-color" content="#e8590c">
<title>Cocina Fácil · Recetario para principiantes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@400;500;600&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --h:40;
  --bg:hsl(var(--h) 22% 96%);--card:#fff;--tx:#241c17;--mu:#75685f;--bd:hsl(var(--h) 25% 86%);
  --ac:hsl(var(--h) 85% 40%);--ac2:hsl(calc(var(--h) + 35) 80% 50%);--on:#fff;
  --pic:hsl(var(--h) 80% 88%);--sh:0 2px 10px rgba(30,20,10,.08);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:hsl(var(--h) 20% 9%);--card:hsl(var(--h) 16% 14%);--tx:#f4eee9;--mu:#aa9d93;
  --bd:hsl(var(--h) 14% 25%);--ac:hsl(var(--h) 85% 62%);--on:#1b1208;--pic:hsl(var(--h) 30% 22%);
  --sh:0 2px 14px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:hsl(var(--h) 20% 9%);--card:hsl(var(--h) 16% 14%);--tx:#f4eee9;--mu:#aa9d93;
  --bd:hsl(var(--h) 14% 25%);--ac:hsl(var(--h) 85% 62%);--on:#1b1208;--pic:hsl(var(--h) 30% 22%);
  --sh:0 2px 14px rgba(0,0,0,.5);
}
:root[data-v=inicio]{--h:40}:root[data-v=recetas]{--h:145}:root[data-v=guardados]{--h:325}:root[data-v=mias]{--h:205}
*{box-sizing:border-box}
html{scroll-padding-top:calc(58px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Fredoka,system-ui,-apple-system,sans-serif;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:12;background:var(--card)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:6px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom:2px solid var(--ac);display:flex;align-items:center;gap:6px;padding:8px 12px;overflow-x:auto;scrollbar-width:none}
header::-webkit-scrollbar{display:none}
.brand{font:800 1.25rem 'Playfair Display',Georgia,serif;color:var(--tx);text-decoration:none;white-space:nowrap;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand .lg{font-size:1.4rem;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
nav{display:flex;gap:4px}
nav a{color:var(--tx);text-decoration:none;padding:7px 13px;border-radius:99px;white-space:nowrap;font-weight:600;transition:background .2s,color .2s}
nav a.on{background:var(--ac);color:var(--on)}
.iconbtn{border:1px solid var(--bd);background:var(--card);border-radius:50%;width:38px;height:38px;flex:none;cursor:pointer;font-size:1.1rem;display:grid;place-items:center;transition:transform .15s}
.iconbtn:hover{transform:rotate(15deg) scale(1.08)}
main{max-width:1020px;margin:0 auto;padding:16px 16px 60px}
h3{margin:24px 0 10px}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:58px 22px;text-align:center;color:#fff;background:radial-gradient(circle at 20% 15%,#ffc83a,transparent 45%),radial-gradient(circle at 85% 90%,#ff9a3a,transparent 40%),linear-gradient(135deg,#e5352b,#ff7a1a);box-shadow:var(--sh)}
.hero h1{font:800 clamp(2.4rem,10vw,4.2rem)/1 'Playfair Display',Georgia,serif;margin:0 0 10px}
.hero p{max-width:34ch;margin:0 auto 20px;font-size:1.1rem;opacity:.95}
.hero .stats{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin:0 auto 22px;font-weight:600}
.hero .stats b{font-size:1.4rem;display:block;font-family:'Playfair Display',serif}
.fl{position:absolute;font-size:2.6rem;opacity:.3;animation:fl 6s ease-in-out infinite;pointer-events:none}
@keyframes fl{50%{transform:translateY(-14px) rotate(8deg)}}
@media(prefers-reduced-motion:reduce){.fl{animation:none}*{transition:none!important;animation:none!important}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:16px}
.tile{display:block;text-decoration:none;color:#fff;border-radius:22px;padding:20px;min-height:150px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;box-shadow:var(--sh)}
.tile:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.2)}
.tile span{font-size:2.4rem;display:block}.tile b{font-size:1.25rem}.tile small{display:block;opacity:.9}
.tip{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--ac);border-radius:6px 16px 16px 6px;padding:12px 14px}
.ban{border-radius:22px;padding:22px;margin-bottom:14px;color:#fff;background:linear-gradient(120deg,hsl(var(--h) 70% 32%),hsl(calc(var(--h) + 35) 75% 45%));box-shadow:var(--sh)}
.ban h2{margin:0;font-size:1.8rem}.ban p{margin:4px 0 0;opacity:.92}
:root[data-v=recetas] .ban{border-radius:22px 22px 70px 22px}
:root[data-v=guardados] .ban{border-radius:70px 22px 22px 22px}
:root[data-v=mias] .ban h2{font:700 2.4rem Caveat,cursive}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.bar input{flex:1;min-width:140px;width:auto}
.btn{font:inherit;border:2px solid var(--ac);border-radius:12px;padding:9px 16px;background:var(--ac);color:var(--on);cursor:pointer;font-weight:600;transition:filter .15s,transform .1s;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.g{background:transparent;color:var(--ac)}.btn.r{background:#c62828;border-color:#c62828;color:#fff}
.btn.sm{padding:6px 11px;font-size:.88rem;border-width:1.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;cursor:pointer;transition:background .2s,color .2s}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
:root[data-v=guardados] .chip{border-radius:14px 14px 4px 4px;padding:9px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;position:relative;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;box-shadow:var(--sh)}
.card:hover{transform:translateY(-4px);border-color:var(--ac);box-shadow:0 10px 22px rgba(0,0,0,.16)}
.card:focus-within{outline:3px solid var(--ac)}
:root[data-v=guardados] .card{border-radius:26px 26px 6px 26px}
:root[data-v=mias] .grid{grid-template-columns:1fr}
:root[data-v=mias] .card{display:flex;border-left:8px solid var(--ac);border-radius:6px 18px 18px 6px}
:root[data-v=mias] .pic{width:140px;height:auto;min-height:110px;flex:none}
:root[data-v=mias] .cb{align-self:center}:root[data-v=mias] .cb h3{font:700 1.6rem Caveat,cursive;margin:0}
.pic{height:140px;display:grid;place-items:center;font-size:3.6rem;background:var(--pic) center/cover no-repeat;position:relative}
.badge{position:absolute;top:8px;left:8px;background:#000b;color:#fff;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:99px;backdrop-filter:blur(4px)}
.star{position:absolute;top:8px;right:8px;border:0;border-radius:50%;width:38px;height:38px;background:#fffeb8;color:#c2185b;font-size:1.25rem;cursor:pointer;backdrop-filter:blur(4px);display:grid;place-items:center;transition:transform .15s}
.star:hover{transform:scale(1.15)}
.cardrate{position:absolute;bottom:8px;right:8px;background:#000a;color:#ffd54f;font-size:.8rem;padding:2px 8px;border-radius:99px}
.cb{padding:10px 12px}.cb h3{margin:0;font-size:1.05rem}
.meta{color:var(--mu);font-size:.85rem;display:flex;gap:4px 12px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(10,5,0,.55);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--card);width:min(680px,100%);max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media(min-width:700px){.ov{align-items:center}.md{border-radius:22px}}
.md .pic{height:200px;border-radius:14px;font-size:5rem;margin-bottom:10px}
.md h2{margin:0 0 4px}
.rate{display:flex;gap:2px;font-size:1.6rem;margin:4px 0 10px}
.rate button{border:0;background:none;cursor:pointer;padding:0 2px;color:#c9bfa8;font-size:inherit;transition:transform .1s}
.rate button.on{color:#ffb300}
.rate button:hover{transform:scale(1.2)}
.stepper{display:flex;align-items:center;gap:10px;margin:8px 0}
.stepper button{width:36px;height:36px;border-radius:50%;border:2px solid var(--ac);background:var(--card);color:var(--ac);font-size:1.2rem;font-weight:700;cursor:pointer}
.stepper b{min-width:80px;text-align:center}
.st label{display:flex;gap:10px;padding:7px 0;align-items:flex-start;cursor:pointer;border-bottom:1px dashed var(--bd)}
.st label:last-child{border-bottom:0}
.st input{width:auto;margin-top:5px;accent-color:var(--ac);transform:scale(1.25)}
.st input:checked+span{text-decoration:line-through;opacity:.55}
.prog{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px;transition:width .3s}
.tipb{background:var(--pic);color:var(--tx);border-radius:12px;padding:10px 12px}
.timer{background:var(--pic);border-radius:14px;padding:12px;margin:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.timer input{width:80px;padding:6px}
.timer .tt{font:700 1.5rem 'Playfair Display',serif;min-width:86px;text-align:center;font-variant-numeric:tabular-nums}
.fm{display:grid;gap:10px}.fm label{display:grid;gap:3px;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:99px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90%;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
.empty{color:var(--mu);padding:22px;border:2px dashed var(--bd);border-radius:16px;grid-column:1/-1;text-align:center}
#print{display:none}
@media print{
  body>*{display:none!important}
  #print{display:block!important;color:#000;font-family:Georgia,serif}
  #print img{width:100%;max-height:260px;object-fit:cover;border-radius:8px}
  #print h1{margin:8px 0 2px}
  #print .pm{color:#555;font-size:.9rem;margin-bottom:8px}
  #print h2{font-size:1.05rem;margin:14px 0 6px;border-bottom:2px solid #e8590c;padding-bottom:2px}
  #print li{margin:3px 0}
}
/* ===== CHATBOT IA (Groq) ===== */
#chat-btn{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:40;width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:var(--on);font-size:1.6rem;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25);display:grid;place-items:center;transition:transform .2s}
#chat-btn:hover{transform:scale(1.08)}
#chat-panel{position:fixed;right:12px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:41;width:min(380px,calc(100vw - 24px));height:min(520px,70vh);background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden;transform:translateY(20px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#chat-panel.open{opacity:1;transform:none;pointer-events:auto}
#chat-header{background:linear-gradient(120deg,hsl(var(--h) 70% 32%),hsl(calc(var(--h)+35) 75% 45%));color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;font-weight:600}
#chat-header button{margin-left:auto;background:transparent;border:0;color:#fff;font-size:1.2rem;cursor:pointer;opacity:.9}
#chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:.95rem;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--ac);color:var(--on);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--pic);color:var(--tx);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:transparent;color:var(--mu);font-size:.82rem;text-align:center}
#chat-input-bar{display:flex;gap:6px;padding:10px;border-top:1px solid var(--bd)}
#chat-input{flex:1;border-radius:12px;padding:10px 12px}
#chat-send{border:0;background:var(--ac);color:var(--on);border-radius:12px;padding:0 14px;font-weight:600;cursor:pointer}
#chat-send:disabled{opacity:.5;cursor:not-allowed}
#api-gate{position:fixed;inset:0;background:rgba(10,5,0,.7);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
#api-gate .box{background:var(--card);border-radius:20px;padding:24px;max-width:400px;width:100%;box-shadow:var(--sh)}
#api-gate h2{margin:0 0 8px;font-size:1.4rem}
#api-gate p{color:var(--mu);font-size:.92rem;margin:0 0 14px}
#api-gate input{margin-bottom:12px}
#api-gate .warn{font-size:.8rem;color:#c62828;margin-top:8px}
</style>

<body>
<header>
  <a class="brand" href="#inicio"><span class="lg">🍳</span>Cocina Fácil</a>

<main></main>

<div id="print"></div>

    <button id="chat-send">Enviar</button>

</div>

const FR=[[1/4,'¼'],[1/3,'⅓'],[1/2,'½'],[2/3,'⅔'],[3/4,'¾']];
function fmtQty(v){
  if(v<=0.09)return'pizca';
  const w=Math.floor(v+0.04),r=v-w;
  if(r<0.09)return String(w);
  let bf=null,bd=1;
  for(const[f]of FR)if(Math.abs(r-f)<bd){bd=Math.abs(r-f);bf=f}
  const g=FR.find(f=>f[0]===bf)[1];
  return w>0?String(w)+g:(bd>0.1?String(Math.round(v*10)/10):g);
}
function scaleIng(line,ratio){
  return line.replace(/^\s*(\d+(?:[.,]\d+)?(?:\s+\d+\/\d+)?|\d+\/\d+|[¼½¾⅓⅔])/u,m=>{
    let v;
    const gm={'¼':1/4,'½':1/2,'¾':3/4,'⅓':1/3,'⅔':2/3}[m.trim()];
    if(gm!==undefined)v=gm;
    else if(m.includes('/')){const p=m.trim().split(/\s+/),fr=p[p.length-1].split('/'),n=+fr[0],d=+fr[1];v=(p.length>1?+p[0]:0)+n/d}
    else v=parseFloat(m.replace(',','.'));
    return ' '+fmtQty(v*ratio);
  });
}
function beep(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.setValueAtTime(.25,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.9);o.start();o.stop(ctx.currentTime+.9)}catch(e){}}
function copyTxt(t,msg){navigator.clipboard?.writeText(t).then(()=>toast(msg)).catch(()=>toast('No se pudo copiar'))}
function shareRecipe(r){

function modalId(){const b=document.querySelector('.md [data-save],[data-print],[data-share],[data-edit],[data-del]');return b?(b.dataset.save||b.dataset.print||b.dataset.share||b.dataset.edit||b.dataset.del):null}
document.addEventListener('click',e=>{
  const g=a=>e.target.closest(`[${a}]`);let x;
  if(x=g('data-rate')){const id=modalId();if(!id)return;const rate=+x.dataset.rate;
    db.ratings[id]=rate;persist();
    document.querySelectorAll('[data-rate]').forEach(b=>b.classList.toggle('on',+b.dataset.rate<=rate));
    toast('Calificaste con '+rate+' ★');return}
  if(x=g('data-srv')){const id=modalId(),r=get(id);if(!r)return;
    curServ=Math.max(1,Math.min(24,curServ+ +x.dataset.srv));
    $('#svb').textContent=curServ+' porciones';$('#ing').innerHTML=ingList(r);return}
  if(x=g('data-ck'))return; // checkbox nativo
  if(x=g('data-open'))return detail(x.dataset.open);
  if(x=g('data-save')){e.stopPropagation();return saveDlg(x.dataset.save)}
  if(x=g('data-ok')){const id=x.dataset.ok;
    document.querySelectorAll('[data-cn]').forEach(c=>{const a=db.cols[c.dataset.cn],i=a.indexOf(id);if(c.checked&&i<0)a.push(id);if(!c.checked&&i>=0)a.splice(i,1)});
    const n=$('#nc').value.trim();
    if(n){db.cols[n]=db.cols[n]||[];if(!db.cols[n].includes(id))db.cols[n].push(id)}
    if(persist()){closeM();render(true);toast('Guardado ✓')}return}
  if(g('data-x'))return closeM();
  if(g('data-new'))return form();
  if(x=g('data-edit'))return form(x.dataset.edit);
  if(x=g('data-save2'))return saveRec(x.dataset.save2||null);
  if(x=g('data-del')){const id=x.dataset.del;return conf('¿Eliminar esta receta?',()=>{db.user=db.user.filter(r=>r.id!==id);Object.values(db.cols).forEach(a=>{const i=a.indexOf(id);if(i>=0)a.splice(i,1)});delete db.checks[id];delete db.ratings[id];persist();render(true);toast('Receta eliminada')})}
  if(x=g('data-print'))return printRecipe(x.dataset.print);
  if(x=g('data-share'))return shareRecipe(get(x.dataset.share));
  if(x=g('data-shop')){const r=get(x.dataset.shop);return copyTxt(r.ing.join('\n'),'Lista de compras copiada ✓')}
  if(g('data-tstart'))return tStart();
  if(g('data-tstop'))return tStop();
  if(x=g('data-cat')){cat=x.dataset.cat;return render(true)}
  if(x=g('data-col')){col=x.dataset.col;return render(true)}
  if(g('data-newcol'))return ask('Nombre de la carpeta nueva','',n=>{n=n.trim();if(!n||db.cols[n])return toast('Escribe un nombre que no exista');db.cols[n]=[];col=n;persist();render(true)});
  if(g('data-rencol'))return ask('Nuevo nombre de la carpeta',col,n=>{n=n.trim();if(!n||db.cols[n])return toast('Escribe un nombre que no exista');db.cols=Object.fromEntries(Object.entries(db.cols).map(([k,v])=>[k===col?n:k,v]));col=n;persist();render(true)});
  if(g('data-delcol')){if(Object.keys(db.cols).length<2)return toast('Debe quedar al menos una carpeta');return conf(`¿Eliminar la carpeta «${esc(col)}»? Las recetas no se borran.`,()=>{delete db.cols[col];col=null;persist();render(true)})}
  if(g('data-an')){const v=$('#an').value;closeM();return cb(v)}
  if(g('data-yes')){closeM();return cb()}

  if(g('data-imp'))return $('#imp').click();

  if(e.key==='Enter'&&e.target.matches('.card'))detail(e.target.dataset.open);
});
$('#theme').addEventListener('click',()=>{db.theme=db.theme==='auto'?'light':db.theme==='light'?'dark':'auto';persist();applyTheme()});
addEventListener('hashchange',()=>render());

/* ============ CHATBOT IA (Groq) ============ */
const GROQ_URL='https://api.groq.com/openai/v1/chat/completions';
const GROQ_MODEL='qwen/qwen3.8-27b'; // Modelo actual Qwen 3.8 27B de Groq (nov 2026)
let groqKey=localStorage.getItem('groq_api_key')||'';
let chatHist=[]; // {role, content}
let chatBusy=false;

function getAppContext(){
  const recipes=all().map(r=>({
    id:r.id, name:r.name, cat:r.cat, tiempo:r.t+' min', dific:r.d, porciones:r.s,
    ingredientes:r.ing, pasos:r.st, tip:r.tip||''
  }));
  const favs=(db.cols.Favoritos||[]).map(id=>{const r=get(id);return r?r.name:id});
  const recentNames=db.recent.map(id=>{const r=get(id);return r?r.name:id}).filter(Boolean);
  return {
    vista_actual: location.hash.slice(1)||'inicio',
    total_recetas: recipes.length,
    recetas_propias: db.user.length,
    carpetas: Object.keys(db.cols),
    favoritos: favs,
    vistas_recientes: recentNames,
    recetas: recipes
  };
}

function buildSystemPrompt(){
  const ctx=getAppContext();
  // Contexto compacto para no saturar tokens (solo nombres + meta, detalles bajo demanda)
  const lista=ctx.recetas.map(r=>`• ${r.name} (${r.cat}, ${r.tiempo}, ${r.dific}, ${r.porciones} porc.)`).join('\n');
  return `Eres el asistente oficial de "Cocina Fácil", un recetario web para principiantes en español.
Responde SIEMPRE en español, de forma amable, clara y práctica. Sé conciso pero útil.

CAPACIDADES DE LA APP (tienes acceso completo a su estado actual):
- Ver, buscar y filtrar recetas por categoría o nombre.
- Ajustar porciones (escala ingredientes automáticamente).
- Temporizador integrado.
- Guardar recetas en carpetas personalizadas.
- Crear/editar/eliminar recetas propias con foto.
- Calificar, imprimir, compartir y generar lista de compras.
- Tema claro/oscuro.
- Funciona offline (excepto este chat).

ESTADO ACTUAL DE LA PÁGINA:
- Vista actual: #${ctx.vista_actual}
- Total de recetas: ${ctx.total_recetas} (${ctx.recetas_propias} creadas por el usuario)
- Carpetas: ${ctx.carpetas.join(', ')}
- Favoritos: ${ctx.favoritos.length?ctx.favoritos.join(', '):'ninguno'}
- Vistas recientemente: ${ctx.vistas_recientes.join(', ')||'ninguna'}

LISTA DE RECETAS DISPONIBLES:
${lista}

Cuando el usuario pregunte por una receta concreta, puedes dar los ingredientes, pasos y tips exactos porque conoces todos los datos.
Puedes sugerir recetas según ingredientes que tenga, nivel de dificultad, tiempo disponible o categoría.
Ayuda a escalar porciones, dar tips de cocina para principiantes, explicar técnicas y motivar.
Si te piden algo fuera de cocina o de esta app, redirige amablemente.
No inventes recetas que no estén en la lista a menos que el usuario te pida crear una nueva idea.`;
}

function showApiGate(){
  if(document.getElementById('api-gate'))return;
  const g=document.createElement('div');
  g.id='api-gate';
  g.innerHTML=`<div class="box">
    <h2>🔑 Acceso al Asistente IA</h2>
    <p>Introduce tu <b>API Key de Groq</b> para activar el chatbot de cocina. Se guarda solo en este dispositivo (localStorage).</p>
    <input id="api-key-input" type="password" placeholder="gsk_..." autocomplete="off" aria-label="API Key de Groq">
    <div class="bar">
      <button class="btn" id="api-save">Activar IA</button>
      <button class="btn g" id="api-skip">Continuar sin IA</button>
    </div>
    <p class="warn">⚠️ Advertencia de seguridad: una API key en el navegador puede ser vista por cualquiera que abra las herramientas de desarrollador. Usa solo una key con límite bajo o de prueba. Lo ideal es un backend proxy.</p>
  </div>`;
  document.body.append(g);
  $('#api-key-input').focus();
  $('#api-save').onclick=()=>{
    const k=$('#api-key-input').value.trim();
    if(!k.startsWith('gsk_')&&k.length<20){toast('La key de Groq suele empezar por gsk_');return;}
    groqKey=k;
    localStorage.setItem('groq_api_key',k);
    g.remove();
    toast('Asistente IA activado ✓');
    openChat();
  };
  $('#api-skip').onclick=()=>{g.remove();toast('Puedes activar la IA más tarde tocando 🤖');};
}

function openChat(){
  if(!groqKey){showApiGate();return;}
  $('#chat-panel').classList.add('open');
  if(!chatHist.length){
    addMsg('sys','¡Hola! Soy tu asistente de Cocina Fácil. Pregúntame por cualquier receta, tips, cómo ajustar porciones o qué cocinar hoy.');
  }
  $('#chat-input').focus();
}
function closeChat(){$('#chat-panel').classList.remove('open')}

function addMsg(role,text){
  const d=document.createElement('div');
  d.className='msg '+role;
  d.textContent=text;
  $('#chat-msgs').append(d);
  $('#chat-msgs').scrollTop=$('#chat-msgs').scrollHeight;
}

async function sendChat(){
  const inp=$('#chat-input');
  const text=inp.value.trim();
  if(!text||chatBusy||!groqKey)return;
  inp.value='';
  addMsg('user',text);
  chatHist.push({role:'user',content:text});
  chatBusy=true;
  $('#chat-send').disabled=true;
  addMsg('sys','Pensando…');

  try{
    const messages=[
      {role:'system',content:buildSystemPrompt()},
      ...chatHist.slice(-12) // últimas 12 para no pasarnos de tokens
    ];
    const res=await fetch(GROQ_URL,{
      method:'POST',
      headers:{
        'Authorization':'Bearer '+groqKey,
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        model:GROQ_MODEL,
        messages,
        temperature:0.6,
        max_tokens:1024
      })
    });
    const data=await res.json();
    // quitar el "Pensando…"
    const last=$('#chat-msgs').lastElementChild;
    if(last&&last.classList.contains('sys'))last.remove();

    if(!res.ok){
      const err=data.error?.message||JSON.stringify(data);
      addMsg('bot','⚠️ Error de Groq: '+err);
      if(res.status===401){localStorage.removeItem('groq_api_key');groqKey='';toast('Key inválida. Vuelve a introducirla.');}
    }else{
      const reply=data.choices?.[0]?.message?.content||'Sin respuesta';
      addMsg('bot',reply);
      chatHist.push({role:'assistant',content:reply});
    }
  }catch(e){
    const last=$('#chat-msgs').lastElementChild;
    if(last&&last.classList.contains('sys'))last.remove();
    addMsg('bot','⚠️ Error de red: '+e.message+'. ¿Tienes internet?');
  }
  chatBusy=false;
  $('#chat-send').disabled=false;
  $('#chat-input').focus();
}

$('#chat-btn').addEventListener('click',()=>openChat());
$('#chat-close').addEventListener('click',closeChat);
$('#chat-send').addEventListener('click',sendChat);
$('#chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}});

// Al cargar: si no hay key, no forzamos el modal (solo al abrir chat)
applyTheme();render();
</script>
